<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>智慧问答系统知识库</title>
  <style>
    :root{
      --bg:#f0f2f5;
      --panel:#ffffff;
      --text:#1a1a2e;
      --muted:#8e95a5;
      --brand:#2563eb;
      --brand2:#7c3aed;
      --bubble-user:#2563eb;
      --bubble-bot:#ffffff;
      --border:#e3e6ec;
      --shadow:0 8px 32px rgba(0,0,0,.08);
      --code-bg:#f5f6f8;
      --code-text:#d6336c;
      --msg-enter:0 3px 12px rgba(0,0,0,.06);
      --scrollbar:rgba(0,0,0,.15);
      --topbar-bg:linear-gradient(90deg,rgba(37,99,235,.06),rgba(124,58,237,.06));
    }
    [data-theme="dark"]{
      --bg:#0f0f1a;
      --panel:#1a1a2e;
      --text:#e0e0e8;
      --muted:#6b7280;
      --brand:#3b82f6;
      --brand2:#a78bfa;
      --bubble-user:#2563eb;
      --bubble-bot:#252538;
      --border:#2a2a3e;
      --shadow:0 8px 32px rgba(0,0,0,.3);
      --code-bg:#1e1e30;
      --code-text:#f472b6;
      --msg-enter:0 3px 12px rgba(0,0,0,.2);
      --scrollbar:rgba(255,255,255,.15);
      --topbar-bg:linear-gradient(90deg,rgba(59,130,236,.1),rgba(167,139,250,.1));
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
      background:radial-gradient(1200px 600px at 20% 0%,rgba(37,99,235,.12),transparent 60%),
                 radial-gradient(1000px 500px at 90% 10%,rgba(124,58,237,.10),transparent 55%),
                 var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:12px;
      transition:background .3s,color .3s;
    }
    .app{
      width:100%;max-width:1000px;height:min(86vh,860px);
      background:var(--panel);border:1px solid var(--border);
      border-radius:18px;box-shadow:var(--shadow);overflow:hidden;
      display:flex;flex-direction:column;
      transition:background .3s,border-color .3s;
    }
    .topbar{
      display:flex;align-items:center;gap:12px;padding:12px 18px;
      border-bottom:1px solid var(--border);background:var(--topbar-bg);
    }
    .brand{display:flex;align-items:center;gap:10px}
    .logo{
      width:38px;height:38px;border-radius:11px;
      background:linear-gradient(135deg,var(--brand),var(--brand2));
      display:flex;align-items:center;justify-content:center;
      box-shadow:0 4px 14px rgba(37,99,235,.25);
    }
    .logo svg{width:20px;height:20px}
    .title{display:flex;flex-direction:column;line-height:1.1}
    .title strong{font-size:15px;letter-spacing:.3px}
    .title span{font-size:11px;color:var(--muted);margin-top:3px}
    .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
    .icon-btn{
      width:36px;height:36px;border:1px solid var(--border);border-radius:10px;
      background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;
      color:var(--muted);transition:all .2s;
    }
    .icon-btn:hover{border-color:var(--brand);color:var(--brand)}
    .icon-btn svg{width:18px;height:18px}
    .pill{
      font-size:11px;color:var(--muted);border:1px solid var(--border);
      padding:5px 10px;border-radius:999px;background:var(--panel);
      display:flex;align-items:center;gap:5px;
    }
    .pill .dot{width:7px;height:7px;border-radius:50%;flex:0 0 auto}
    .dot.ok{background:#22c55e;box-shadow:0 0 6px #22c55e99}
    .dot.err{background:#ef4444}
    .toggle-wrap{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none}
    .toggle{position:relative;width:38px;height:22px;border-radius:999px;background:var(--border);transition:background .2s;cursor:pointer;border:none}
    .toggle.on{background:var(--brand)}
    .toggle::after{content:"";position:absolute;top:2px;left:2px;width:18px;height:18px;border-radius:50%;background:#fff;transition:transform .2s}
    .toggle.on::after{transform:translateX(16px)}

    .chat{flex:1;overflow:auto;padding:10px 18px;scroll-behavior:smooth}
    .chat::-webkit-scrollbar{width:6px}
    .chat::-webkit-scrollbar-track{background:transparent}
    .chat::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}

    .welcome-msg{padding:30px 20px;text-align:center}
    .welcome-msg h2{font-size:18px;margin-bottom:8px;font-weight:600}
    .welcome-msg p{font-size:13px;color:var(--muted);margin-bottom:20px}
    .examples{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px;margin:0 auto}
    .example-chip{
      padding:10px 16px;border:1px solid var(--border);border-radius:12px;
      background:var(--panel);cursor:pointer;font-size:13px;color:var(--text);
      transition:all .2s;
    }
    .example-chip:hover{border-color:var(--brand);color:var(--brand);box-shadow:0 2px 8px rgba(37,99,235,.12)}

    .msg{display:flex;gap:10px;margin:12px 0;align-items:flex-end;animation:fadeInUp .3s ease}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .msg.user{justify-content:flex-end}
    .msg > div:not(.avatar){flex:1;min-width:0}
    .msg.user > div:not(.avatar){display:flex;flex-direction:column;align-items:flex-end}
    .avatar{
      width:36px;height:36px;border-radius:11px;flex:0 0 auto;
      display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;
    }
    .avatar.bot{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
    .avatar.user{background:var(--code-bg);color:var(--text)}
    .bubble{
      max-width:min(720px,78%);display:inline-block;border-radius:14px;padding:11px 14px;
      border:1px solid var(--border);background:var(--bubble-bot);line-height:1.65;font-size:14px;
      word-wrap:break-word;overflow-wrap:anywhere;box-shadow:var(--msg-enter);
    }
    .msg.user .bubble{background:var(--bubble-user);color:#fff;border-color:transparent}
    .meta{font-size:11px;color:var(--muted);margin-top:5px}
    .msg.user .meta{color:rgba(255,255,255,.7)}

    .bubble p{margin:0 0 8px}
    .bubble p:last-child{margin-bottom:0}
    .bubble strong{font-weight:600}
    .bubble em{font-style:italic}
    .bubble ul,.bubble ol{margin:4px 0 8px;padding-left:22px}
    .bubble li{margin:2px 0}
    .bubble code{background:var(--code-bg);color:var(--code-text);padding:2px 6px;border-radius:5px;font-size:13px;font-family:ui-monospace,monospace}
    .bubble pre{background:var(--code-bg);border:1px solid var(--border);border-radius:10px;padding:12px;overflow-x:auto;margin:8px 0}
    .bubble pre code{background:none;color:inherit;padding:0;font-size:13px}
    .bubble a{color:var(--brand);text-decoration:none;border-bottom:1px solid transparent}
    .bubble a:hover{border-bottom-color:var(--brand)}
    [data-theme="dark"] .bubble a{color:var(--brand2)}
    .bubble table{border-collapse:collapse;width:100%;margin:8px 0;font-size:13px}
    .bubble th,.bubble td{border:1px solid var(--border);padding:6px 10px;text-align:left}
    .bubble th{background:var(--code-bg)}

    .msg-actions{display:flex;gap:6px;margin-top:5px}
    .msg-actions button{
      border:1px solid var(--border);background:var(--panel);border-radius:8px;
      padding:3px 8px;font-size:11px;color:var(--muted);cursor:pointer;transition:all .15s;
    }
    .msg-actions button:hover{border-color:var(--brand);color:var(--brand)}

    details.progress{margin-top:8px;border:1px dashed rgba(142,149,165,.4);border-radius:10px;padding:8px 10px;background:rgba(142,149,165,.05)}
    details.progress summary{cursor:pointer;user-select:none;color:var(--muted);font-size:12px}
    .progress ul{margin:8px 0 0 18px;padding:0;list-style:none}
    .progress li{margin:3px 0;font-size:12px;color:#56657a}
    [data-theme="dark"] .progress li{color:var(--muted)}

    .answer-images{margin-top:10px;display:flex;flex-direction:column;gap:10px}
    .answer-images img{display:block;max-width:min(100%,560px);max-height:520px;border-radius:12px;border:1px solid var(--border);box-shadow:0 6px 18px rgba(0,0,0,.08);background:var(--panel)}
    .answer-images a{font-size:12px;color:var(--muted);text-decoration:none;word-break:break-all}

    .typing{display:inline-flex;gap:5px;align-items:center}
    .typing .dot{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bounce 1.2s infinite ease-in-out}
    .typing .dot:nth-child(2){animation-delay:.15s}
    .typing .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-5px);opacity:1}}

    .composer{border-top:1px solid var(--border);padding:12px 18px;display:flex;gap:10px;align-items:flex-end;background:var(--panel)}
    textarea{
      flex:1;resize:none;min-height:44px;max-height:140px;padding:11px 14px;border-radius:12px;
      border:1px solid var(--border);outline:none;font-size:14px;line-height:1.5;background:var(--panel);color:var(--text);
      transition:border-color .2s,box-shadow .2s;font-family:inherit;
    }
    textarea:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.1)}
    .send{
      width:80px;height:44px;border:none;border-radius:12px;cursor:pointer;font-size:14px;
      color:#fff;background:linear-gradient(135deg,var(--brand),var(--brand2));transition:opacity .2s,transform .1s;
      display:flex;align-items:center;justify-content:center;gap:5px;
    }
    .send:disabled{opacity:.5;cursor:not-allowed}
    .send:not(:disabled):active{transform:scale(.96)}
    .send svg{width:16px;height:16px}
    .hint{padding:0 18px 10px;color:var(--muted);font-size:11px;background:var(--panel)}
    .kbd{font-family:ui-monospace,monospace;border:1px solid var(--border);padding:1px 5px;border-radius:5px;background:var(--code-bg);font-size:11px}

    @media(max-width:640px){
      body{padding:0}
      .app{border-radius:0;border:none;height:100vh;max-width:100%}
      .title span{display:none}
      .hint{display:none}
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
        <div class="title">
          <strong>智慧问答系统</strong>
          <span id="subTitle">在线 - 可查询知识库与联网信息</span>
        </div>
      </div>
      <div class="top-actions">
        <div class="toggle-wrap"><button class="toggle on" id="streamToggle"></button>流式</div>
        <span class="pill" id="apiPill"><span class="dot err"></span>未连接</span>
        <button class="icon-btn" id="btnTheme" title="切换主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <button class="icon-btn" id="btnClear" title="清空对话"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg></button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="msg bot" id="welcomeMsg">
        <div class="avatar bot">掌</div>
        <div>
          <div class="bubble">你好，我是智慧问答系统知识库助手。你可以直接提问，支持知识库检索和联网搜索。</div>
          <div class="meta">提示：点击下方示例问题快速开始</div>
          <div class="examples" style="margin-top:10px;text-align:left">
            <div class="example-chip" onclick="quickAsk('如何使用万用表测量电压？')">如何使用万用表测量电压？</div>
            <div class="example-chip" onclick="quickAsk('三极管的基本原理是什么？')">三极管的基本原理是什么？</div>
            <div class="example-chip" onclick="quickAsk('LED灯带安装注意事项')">LED灯带安装注意事项</div>
          </div>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）" rows="1"></textarea>
      <button class="send" id="send"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
  </div>

  <script>
    const API_BASE = location.protocol.startsWith("http") ? `${location.protocol}//${location.host}` : "http://127.0.0.1:8001";
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const apiPill = document.getElementById("apiPill");
    const btnClear = document.getElementById("btnClear");
    const btnTheme = document.getElementById("btnTheme");
    const streamToggle = document.getElementById("streamToggle");

    let sessionId = localStorage.getItem("kb_session_id");
    if(!sessionId){sessionId="sess-"+Math.random().toString(36).slice(2)+Date.now().toString(36);localStorage.setItem("kb_session_id",sessionId)}

    // ---- theme ----
    const savedTheme = localStorage.getItem("kb_theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);
    btnTheme.addEventListener("click", ()=>{
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("kb_theme", next);
    });

    // ---- auto-resize textarea ----
    inputEl.addEventListener("input", ()=>{
      inputEl.style.height = "auto";
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + "px";
    });

    // ---- markdown renderer ----
    function mdToHtml(text){
      let s = String(text || "");
      const codeBlocks = [];
      s = s.replace(/```(\w*)\n?([\s\S]*?)```/g, function(m, lang, code){
        codeBlocks.push(code);
        return "\x00CB" + (codeBlocks.length - 1) + "\x00";
      });
      s = s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      s = s.replace(/^### (.+)$/gm, "<h3>$1</h3>");
      s = s.replace(/^## (.+)$/gm, "<h2>$1</h2>");
      s = s.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/\*(.+?)\*/g, "<em>$1</em>");
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
      s = s.replace(/(^|\n)(\|.+\|)\n(\|[\s:-]+\|)\n((?:\|.+\|\n?)+)/g, function(_, pre, header, sep, body){
        var h = header.slice(1, -1).split("|").map(function(c){return "<th>" + c.trim() + "</th>";});
        var rows = body.trim().split("\n");
        var t = pre + "<table><thead><tr>" + h.join("") + "</tr></thead><tbody>";
        for (var i = 0; i < rows.length; i++){
          var cells = rows[i].trim().slice(1, -1).split("|").map(function(c){return "<td>" + c.trim() + "</td>";});
          t += "<tr>" + cells.join("") + "</tr>";
        }
        return t + "</tbody></table>";
      });
      var lines = s.split("\n");
      var out = [];
      var inUl = false, inOl = false;
      for (var line of lines){
        var ulMatch = line.match(/^[\s]*[-*] (.+)$/);
        var olMatch = line.match(/^[\s]*\d+\. (.+)$/);
        if (ulMatch){
          if (!inUl){ out.push("<ul>"); inUl = true; }
          if (inOl){ out.push("</ol>"); inOl = false; }
          out.push("<li>" + ulMatch[1] + "</li>");
        } else if (olMatch){
          if (!inOl){ out.push("<ol>"); inOl = true; }
          if (inUl){ out.push("</ul>"); inUl = false; }
          out.push("<li>" + olMatch[1] + "</li>");
        } else {
          if (inUl){ out.push("</ul>"); inUl = false; }
          if (inOl){ out.push("</ol>"); inOl = false; }
          out.push(line);
        }
      }
      if (inUl) out.push("</ul>");
      if (inOl) out.push("</ol>");
      s = out.join("\n");
      s = s.split(/\n{2,}/).map(function(block){
        if (/^\s*<(h2|h3|ul|ol|pre|table)/.test(block.trim())) return block.trim();
        return "<p>" + block.trim().replace(/\n/g, "<br>") + "</p>";
      }).join("");
      s = s.replace(/\x00CB(\d+)\x00/g, function(m, i){
        var code = codeBlocks[parseInt(i)];
        return "<pre><code>" + code.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;") + "</code></pre>";
      });
      return s;
    }
    // ---- helpers (kept from original) ----
    function scrollToBottom(){chatEl.scrollTop = chatEl.scrollHeight}
    function nowTime(){return new Date().toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}
    function formatTime(ts){if(!ts)return nowTime();const d=new Date(Number(ts)*1000);return Number.isNaN(d.getTime())?nowTime():d.toLocaleTimeString("zh-CN",{hour:"2-digit",minute:"2-digit"})}
    function escapeHtml(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
    function isImageUrl(url){try{const u=new URL(url);return /\.(png|jpe?g|gif|webp|bmp|svg)$/i.test(u.pathname)}catch(e){return /\.(png|jpe?g|gif|webp|bmp|svg)(\?|#|$)/i.test(url||"")}}
    function normalizeUrl(u){return String(u||"").trim().replace(/\s/g,"%20")}
    function dedupeKeepOrder(a){const s=new Set(),o=[];for(const x of(Array.isArray(a)?a:[])){const v=String(x||"");if(!v||s.has(v))continue;s.add(v);o.push(v)}return o}
    function extractUrlsLoose(t){const s=String(t||"");const m=s.match(/https?:\/\/[^\s，。]+/g)||[];const urls=[];const tr=u=>String(u||"").replace(/[)\]}'">，。,;；]】）＞]+$/g,"").replace(/^[<([{'"]+|^[＜（【\[]+/g,"");for(const r of m){for(const u of String(r).split(/(?=https?:\/\/)/g)){let v=tr(u);if(v)urls.push(v)}}return dedupeKeepOrder(urls)}
    function parseAnswerAndImages(text){
      const raw=String(text||"");
      const re=/【\s*图片\s*】|\[\s*图片\s*\]/g;let m,lastIdx=-1,lastLen=0;
      while((m=re.exec(raw))!==null){lastIdx=m.index;lastLen=m[0].length}
      if(lastIdx===-1)return{text:raw,images:[]};
      const before=raw.slice(0,lastIdx).trimEnd(),after=raw.slice(lastIdx+lastLen).trim();
      const urls=[];
      for(const line of after.split(/\r?\n/).map(l=>l.trim()).filter(Boolean)){
        if(line.startsWith("http://")||line.startsWith("https://"))urls.push(line);
        else for(const u of extractUrlsLoose(line))urls.push(u);
      }
      const seen=new Set(),images=[];
      for(const u of urls){const n=normalizeUrl(u);if(!isImageUrl(n)||seen.has(n))continue;seen.add(n);images.push(n)}
      return{text:before,images}
    }

    function renderAnswerWithImages(containerEl, answerText, candidateImageUrls){
      const {text, images: imagesFromBlock} = parseAnswerAndImages(answerText);
      const candidates = Array.isArray(candidateImageUrls) ? candidateImageUrls.map(normalizeUrl).filter(isImageUrl) : [];
      const looseImages = extractUrlsLoose(answerText).map(normalizeUrl).filter(isImageUrl);
      const allImages = Array.from(new Set([...(imagesFromBlock||[]), ...candidates, ...looseImages]));
      containerEl.innerHTML = "";
      if((text||"").trim()){
        const textEl = document.createElement("div");
        textEl.className = "answer-text";
        textEl.innerHTML = mdToHtml(text);
        containerEl.appendChild(textEl);
      }else{
        containerEl.innerHTML = '<p style="color:var(--muted)">（已完成，但未返回答案）</p>';
      }
      if(allImages.length){
        const imgWrap = document.createElement("div");
        imgWrap.className = "answer-images";
        for(const url of allImages){
          const img=document.createElement("img");
          img.loading="lazy";img.src=url;img.alt="参考图片";img.referrerPolicy="no-referrer";
          img.addEventListener("error",()=>img.style.display="none");
          imgWrap.appendChild(img);
          const link=document.createElement("a");
          link.href=url;link.target="_blank";link.rel="noopener noreferrer";link.textContent=url;
          imgWrap.appendChild(link);
        }
        containerEl.appendChild(imgWrap);
      }
    }

    function addCopyButton(parentEl, getTextFn){
      const wrap = document.createElement("div");
      wrap.className = "msg-actions";
      const btn = document.createElement("button");
      btn.textContent = "复制";
      btn.addEventListener("click", ()=>{
        navigator.clipboard.writeText(getTextFn()).then(()=>{
          btn.textContent = "已复制";
          setTimeout(()=>btn.textContent="复制", 1500);
        });
      });
      wrap.appendChild(btn);
      parentEl.appendChild(wrap);
    }

    function addUserMsg(text){
      chatEl.insertAdjacentHTML("beforeend",
        `<div class="msg user"><div><div class="bubble">${escapeHtml(text)}</div><div class="meta">${nowTime()}</div></div><div class="avatar user">我</div></div>`);
      scrollToBottom();
    }
    function addUserMsgWithTime(text,ts){
      chatEl.insertAdjacentHTML("beforeend",
        `<div class="msg user"><div><div class="bubble">${escapeHtml(text)}</div><div class="meta">${formatTime(ts)}</div></div><div class="avatar user">我</div></div>`);
      scrollToBottom();
    }
    function addBotMsgWithTime(text,ts,imageUrls){
      const id="bot-his-"+Math.random().toString(36).slice(2);
      chatEl.insertAdjacentHTML("beforeend",
        `<div class="msg bot" id="${id}"><div class="avatar bot">掌</div><div><div class="bubble"><div class="answer"></div></div><div class="meta">${formatTime(ts)}</div></div></div>`);
      const el=document.getElementById(id);
      if(el){const a=el.querySelector(".answer");renderAnswerWithImages(a,text||"",imageUrls||[]);const b=el.querySelector(".bubble");addCopyButton(b,()=>text||"")}
      scrollToBottom();
    }
    function addBotMsgSkeleton(){
      const id="bot-"+Math.random().toString(36).slice(2);
      chatEl.insertAdjacentHTML("beforeend",
        `<div class="msg bot" id="${id}"><div class="avatar bot">掌</div><div style="min-width:180px"><div class="bubble"><span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span><details class="progress" open><summary>阶段进度（等待中）</summary><ul></ul></details></div><div class="meta">${nowTime()}</div></div></div>`);
      scrollToBottom();
      return document.getElementById(id);
    }

    let lastAnswerText = "";
    function renderProgress(botMsgEl,doneList,runningList,status){
      const d=botMsgEl.querySelector("details.progress"),s=d.querySelector("summary"),ul=d.querySelector("ul");
      const done=Array.isArray(doneList)?doneList:[],run=Array.isArray(runningList)?runningList:[];
      const sm={"processing":"处理中","completed":"已完成","failed":"失败","pending":"等待中"};
      s.textContent=`阶段进度（已完成${done.length}，进行中${run.length}，状态：${sm[status]||status||"unknown"}）`;
      const lines=[...done.map(x=>`✅ ${x}`),...run.map(x=>`⏳ ${x}`)];
      ul.innerHTML="";
      if(!lines.length)ul.insertAdjacentHTML("beforeend","<li>暂无进度</li>");
      else for(const l of lines)ul.insertAdjacentHTML("beforeend",`<li>${escapeHtml(l)}</li>`);
    }
    function finalizeBotAnswer(botMsgEl,answer,error,imageUrls){
      const bubble=botMsgEl.querySelector(".bubble"),progress=botMsgEl.querySelector("details.progress");
      const err=(error||"").trim();
      if(progress){progress.remove();progress.removeAttribute("open")}
      bubble.innerHTML="";
      const a=document.createElement("div");a.className="answer";bubble.appendChild(a);
      if(err){a.innerHTML=escapeHtml(`抱歉，本次处理失败：\n${err}`);}
      else{renderAnswerWithImages(a,answer||"",imageUrls||[]);addCopyButton(bubble,()=>answer||lastAnswerText||"")}
      if(progress)bubble.appendChild(progress);
    }

    async function apiHealth(){
      try{const r=await fetch(`${API_BASE}/health`);if(!r.ok)throw 0;
        apiPill.innerHTML='<span class="dot ok"></span>已连接';
      }catch(e){apiPill.innerHTML='<span class="dot err"></span>未连接'}
    }
    async function loadHistory(){
      try{const r=await fetch(`${API_BASE}/history/${sessionId}`);if(!r.ok)return;
        const data=await r.json(),items=Array.isArray(data.items)?data.items:[];
        if(!items.length)return;
        const nodes=Array.from(chatEl.querySelectorAll(".msg"));for(let i=1;i<nodes.length;i++)nodes[i].remove();
        for(const item of items){
          if(item.role==="user")addUserMsgWithTime(item.text||"",item.ts);
          else addBotMsgWithTime(item.text||"",item.ts,item.image_urls||[]);
        }
        scrollToBottom();
      }catch(_){}
    }
    async function submitQuery(text){
      const r=await fetch(`${API_BASE}/query`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({query:text,session_id:sessionId,is_stream:streamToggle.classList.contains("on")})});
      if(!r.ok)throw new Error(await r.text()||"请求失败");
      return await r.json();
    }
    async function poll(taskId,botMsgEl){
      const typing=botMsgEl.querySelector(".typing");
      const iv=setInterval(async()=>{
        try{const r=await fetch(`${API_BASE}/status/${taskId}`);const d=await r.json();
          renderProgress(botMsgEl,d.done_list,d.running_list,d.status);
          if(d.status==="completed"){if(typing)typing.remove();finalizeBotAnswer(botMsgEl,d.answer,d.error,d.image_urls||[]);clearInterval(iv);sendBtn.disabled=false}
          else if(d.status==="failed"){if(typing)typing.remove();finalizeBotAnswer(botMsgEl,d.answer,d.error||"failed",d.image_urls||[]);clearInterval(iv);sendBtn.disabled=false}
        }catch(e){}
      },1200);
    }
    async function onSend(){
      const text=(inputEl.value||"").trim();if(!text)return;
      inputEl.value="";inputEl.style.height="auto";
      // remove welcome examples
      const ex=chatEl.querySelectorAll(".example-chip");ex.forEach(e=>e.parentElement.remove());
      addUserMsg(text);
      const botMsgEl=addBotMsgSkeleton();sendBtn.disabled=true;
      try{
        const isStream=streamToggle.classList.contains("on");
        const data=await submitQuery(text);
        renderProgress(botMsgEl,[],[],"pending");
        if(!isStream){
          renderProgress(botMsgEl,data.done_list||[],[],"completed");
          finalizeBotAnswer(botMsgEl,data.answer,data.error,data.image_urls||[]);
          sendBtn.disabled=false;return;
        }
        const taskId=data.task_id;
        const bubble=botMsgEl.querySelector(".bubble");
        let answerEl=bubble.querySelector(".answer");
        if(!answerEl){answerEl=document.createElement("div");answerEl.className="answer";bubble.insertBefore(answerEl,bubble.firstChild)}
        const es=new EventSource(`${API_BASE}/stream/${taskId}`);
        let rawText="";
        es.addEventListener("progress",e=>{try{const d=JSON.parse(e.data||"{}");renderProgress(botMsgEl,d.done_list,d.running_list,d.status);if(d.status==="completed"){const t=botMsgEl.querySelector(".typing");if(t)t.remove();sendBtn.disabled=false}}catch(_){}});
        es.addEventListener("delta",e=>{try{const d=JSON.parse(e.data||"{}"),delta=d.delta||"";if(delta){rawText+=delta;renderAnswerWithImages(answerEl,rawText,[]);scrollToBottom()}}catch(_){}});
        es.addEventListener("final",e=>{const t=botMsgEl.querySelector(".typing");if(t)t.remove();const p=botMsgEl.querySelector("details.progress");if(p)p.removeAttribute("open");
          try{const d=JSON.parse(e.data||"{}"),ft=(d&&typeof d.answer==="string"&&d.answer.trim())?d.answer:(rawText||answerEl.textContent||"");renderAnswerWithImages(answerEl,ft,d.image_urls||[]);addCopyButton(bubble,()=>ft);lastAnswerText=ft}catch(_){}es.close();sendBtn.disabled=false});
        es.addEventListener("error",e=>{const t=botMsgEl.querySelector(".typing");if(t)t.remove();const p=botMsgEl.querySelector("details.progress");if(p)p.removeAttribute("open");
          try{rawText+=`\n\n（SSE 连接中断）`;renderAnswerWithImages(answerEl,rawText,[])}catch(_){}es.close();sendBtn.disabled=false});
      }catch(e){
        const bubble=botMsgEl.querySelector(".bubble"),typing=botMsgEl.querySelector(".typing");
        if(typing)typing.remove();
        bubble.innerHTML=`<div class="answer">${escapeHtml("请求失败："+(e.message||e))}</div>`;
        sendBtn.disabled=false;
      }
    }
    function quickAsk(q){inputEl.value=q;inputEl.dispatchEvent(new Event("input"));onSend()}

    sendBtn.addEventListener("click",onSend);
    inputEl.addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();onSend()}});
    streamToggle.addEventListener("click",()=>streamToggle.classList.toggle("on"));
    btnClear.addEventListener("click",async()=>{
      if(!confirm("确定要清空当前会话的历史记录吗？"))return;
      try{await fetch(`${API_BASE}/history/${sessionId}`,{method:"DELETE"})}catch(_){}
      const nodes=Array.from(chatEl.querySelectorAll(".msg"));for(let i=1;i<nodes.length;i++)nodes[i].remove();
      scrollToBottom();
    });

    apiHealth();setInterval(apiHealth,5000);loadHistory();setTimeout(()=>inputEl.focus(),200);
  </script>
</body>
</html>
