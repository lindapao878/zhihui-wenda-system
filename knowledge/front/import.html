<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>智慧问答系统 - 文件导入</title>
  <style>
    :root{
      --bg:#f0f2f5;--panel:#ffffff;--text:#1a1a2e;--muted:#8e95a5;
      --brand:#2563eb;--brand2:#7c3aed;--border:#e3e6ec;
      --shadow:0 8px 32px rgba(0,0,0,.08);
      --code-bg:#f5f6f8;--scrollbar:rgba(0,0,0,.15);
      --topbar-bg:linear-gradient(90deg,rgba(37,99,235,.06),rgba(124,58,237,.06));
      --green:#22c55e;--orange:#f59e0b;--red:#ef4444;
    }
    [data-theme="dark"]{
      --bg:#0f0f1a;--panel:#1a1a2e;--text:#e0e0e8;--muted:#6b7280;
      --brand:#3b82f6;--brand2:#a78bfa;--border:#2a2a3e;
      --shadow:0 8px 32px rgba(0,0,0,.3);--code-bg:#1e1e30;
      --scrollbar:rgba(255,255,255,.15);
      --topbar-bg:linear-gradient(90deg,rgba(59,130,236,.1),rgba(167,139,250,.1));
    }
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:"Segoe UI","Microsoft YaHei",system-ui,-apple-system,sans-serif;
      background:radial-gradient(1200px 600px at 20% 0%,rgba(37,99,235,.12),transparent 60%),
                 radial-gradient(1000px 500px at 90% 10%,rgba(124,58,237,.10),transparent 55%),var(--bg);
      color:var(--text);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;
      padding:24px;transition:background .3s,color .3s;
    }
    .app{width:100%;max-width:820px;background:var(--panel);border:1px solid var(--border);
      border-radius:18px;box-shadow:var(--shadow);overflow:hidden;transition:background .3s,border-color .3s}

    .topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;border-bottom:1px solid var(--border);background:var(--topbar-bg)}
    .logo{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));
      display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(37,99,235,.25)}
    .logo svg{width:20px;height:20px}
    .title strong{font-size:15px;letter-spacing:.3px;display:block}
    .title span{font-size:11px;color:var(--muted)}
    .top-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
    .pill{font-size:11px;color:var(--muted);border:1px solid var(--border);padding:5px 10px;border-radius:999px;background:var(--panel);display:flex;align-items:center;gap:5px}
    .pill .dot{width:7px;height:7px;border-radius:50%}
    .dot.ok{background:var(--green);box-shadow:0 0 6px #22c55e99}.dot.err{background:var(--red)}
    .icon-btn{width:36px;height:36px;border:1px solid var(--border);border-radius:10px;background:var(--panel);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:all .2s}
    .icon-btn:hover{border-color:var(--brand);color:var(--brand)}
    .icon-btn svg{width:18px;height:18px}

    .upload-zone{margin:20px;border:2px dashed var(--border);border-radius:14px;padding:40px 20px;text-align:center;cursor:pointer;transition:all .3s;position:relative;overflow:hidden}
    .upload-zone:hover{border-color:var(--brand);background:rgba(37,99,235,.03)}
    .upload-zone.dragover{border-color:var(--brand);background:rgba(37,99,235,.06);transform:scale(.99)}
    .upload-icon{font-size:40px;margin-bottom:10px;opacity:.7}
    .upload-title{font-size:15px;font-weight:600;margin-bottom:4px}
    .upload-hint{font-size:12px;color:var(--muted)}
    .type-tags{display:flex;gap:8px;justify-content:center;margin-top:12px}
    .type-tag{font-size:11px;padding:3px 10px;border-radius:6px;border:1px solid var(--border);color:var(--muted)}
    .file-input{display:none}

    .stats{display:flex;gap:10px;padding:0 20px 16px;flex-wrap:wrap}
    .stat-card{flex:1;min-width:80px;background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px;text-align:center}
    .stat-num{font-size:22px;font-weight:700}
    .stat-label{font-size:11px;color:var(--muted);margin-top:2px}
    .stat-card.total .stat-num{color:var(--brand)}
    .stat-card.done .stat-num{color:var(--green)}
    .stat-card.proc .stat-num{color:var(--orange)}
    .stat-card.fail .stat-num{color:var(--red)}

    .file-list{padding:0 20px 20px;max-height:420px;overflow:auto}
    .file-list::-webkit-scrollbar{width:6px}
    .file-list::-webkit-scrollbar-thumb{background:var(--scrollbar);border-radius:3px}

    .file-item{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;margin-bottom:10px;animation:fadeInUp .3s ease}
    @keyframes fadeInUp{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .file-row{display:flex;align-items:center;gap:10px}
    .file-icon{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;flex:0 0 auto}
    .file-icon.pdf{background:rgba(239,68,68,.12)}.file-icon.md{background:rgba(37,99,235,.12)}.file-icon.docx{background:rgba(34,197,94,.12)}
    .file-info{flex:1;min-width:0}
    .file-name{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .file-size{font-size:11px;color:var(--muted);margin-top:2px}
    .status-badge{padding:4px 10px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;flex:0 0 auto}
    .sb-upload{background:rgba(245,158,11,.12);color:var(--orange)}
    .sb-proc{background:rgba(37,99,235,.12);color:var(--brand)}
    .sb-done{background:rgba(34,197,94,.12);color:var(--green)}
    .sb-fail{background:rgba(239,68,68,.12);color:var(--red)}

    .progress-bar{width:100%;height:3px;background:var(--border);border-radius:2px;overflow:hidden;margin-top:8px}
    .progress-fill{height:100%;border-radius:2px;transition:width .4s,background-color .4s}
    .pf-upload{background:var(--orange);width:40%}
    .pf-proc{background:var(--brand);width:60%}
    .pf-done{background:var(--green);width:100%}
    .pf-fail{background:var(--red);width:100%}

    .log-toggle{margin-top:8px;cursor:pointer;user-select:none;font-size:12px;color:var(--muted);display:flex;align-items:center;gap:4px}
    .log-toggle svg{width:14px;height:14px;transition:transform .2s}
    .log-toggle.open svg{transform:rotate(90deg)}
    .log-list{margin:6px 0 0 16px;padding:0;list-style:none;display:none}
    .log-list.show{display:block}
    .log-list li{margin:2px 0;font-size:12px;color:var(--muted);line-height:1.4}

    .empty{text-align:center;padding:20px;color:var(--muted);font-size:13px}

    .composer{border-top:1px solid var(--border);padding:12px 18px;display:flex;gap:10px;align-items:center;background:var(--panel)}
    .composer span{color:var(--muted);font-size:12px}
    .link-btn{font-size:12px;color:var(--brand);text-decoration:none;border:1px solid var(--border);padding:6px 12px;border-radius:10px;background:var(--panel);cursor:pointer;transition:all .15s;margin-left:auto}
    .link-btn:hover{border-color:var(--brand)}

    @media(max-width:640px){body{padding:0}.app{border-radius:0;border:none;max-width:100%}.stats{padding:0 14px 12px}}
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M12 15v2m-6 4h12a2 2 0 0 0 2-2v-6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v6a2 2 0 0 0 2 2zm10-10V7a4 4 0 0 0-8 0v4h8z"/></svg></div>
      <div class="title"><strong>智慧问答系统 - 文件导入</strong><span>支持 PDF / Markdown / DOCX</span></div>
      <div class="top-actions">
        <span class="pill" id="apiPill"><span class="dot err"></span>未连接</span>
        <button class="icon-btn" id="btnTheme" title="切换主题"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
        <a class="link-btn" id="gotoChat" href="/chat.html">前往问答</a>
      </div>
    </div>

    <div class="upload-zone" id="dropZone">
      <div class="upload-icon">📄</div>
      <div class="upload-title">点击或拖拽文件到此处</div>
      <div class="upload-hint">支持批量上传，单文件最大 50MB</div>
      <div class="type-tags">
        <span class="type-tag">PDF</span><span class="type-tag">Markdown</span><span class="type-tag">DOCX</span>
      </div>
      <input type="file" id="fileInput" class="file-input" multiple accept=".pdf,.md,.docx" />
    </div>

    <div class="stats">
      <div class="stat-card total"><div class="stat-num" id="statTotal">0</div><div class="stat-label">总计</div></div>
      <div class="stat-card done"><div class="stat-num" id="statDone">0</div><div class="stat-label">已完成</div></div>
      <div class="stat-card proc"><div class="stat-num" id="statProc">0</div><div class="stat-label">处理中</div></div>
      <div class="stat-card fail"><div class="stat-num" id="statFail">0</div><div class="stat-label">失败</div></div>
    </div>

    <div class="file-list" id="fileList">
      <div class="empty" id="emptyHint">暂无导入任务，上传文件后将显示在这里</div>
    </div>

    <div class="composer">
      <span>导入的文档可通过问答页面查询</span>
    </div>
  </div>

  <script>
    const API_BASE = location.protocol.startsWith("http") ? `${location.protocol}//${location.host}` : "http://127.0.0.1:8000";
    const dropZone = document.getElementById("dropZone");
    const fileInput = document.getElementById("fileInput");
    const fileList = document.getElementById("fileList");
    const emptyHint = document.getElementById("emptyHint");
    const btnTheme = document.getElementById("btnTheme");

    // theme
    const savedTheme = localStorage.getItem("kb_theme") || "light";
    document.documentElement.setAttribute("data-theme", savedTheme);
    btnTheme.addEventListener("click", ()=>{
      const cur = document.documentElement.getAttribute("data-theme");
      const next = cur === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("kb_theme", next);
    });

    // health
    async function apiHealth(){
      try{const r=await fetch(`${API_BASE}/health`);if(!r.ok)throw 0;
        document.getElementById("apiPill").innerHTML='<span class="dot ok"></span>已连接';
      }catch(e){document.getElementById("apiPill").innerHTML='<span class="dot err"></span>未连接'}
    }
    apiHealth();setInterval(apiHealth,5000);

    // file upload interaction
    dropZone.addEventListener("click", ()=>fileInput.click());
    dropZone.addEventListener("dragover", e=>{e.preventDefault();dropZone.classList.add("dragover")});
    dropZone.addEventListener("dragleave", e=>{e.preventDefault();dropZone.classList.remove("dragover")});
    dropZone.addEventListener("drop", e=>{e.preventDefault();dropZone.classList.remove("dragover");handleFiles(e.dataTransfer.files)});
    fileInput.addEventListener("change", e=>{handleFiles(e.target.files);fileInput.value=""});

    function handleFiles(files){Array.from(files).forEach(uploadFile)}

    function getFileIcon(name){
      const ext = name.split(".").pop().toLowerCase();
      if(ext==="pdf")return{cls:"pdf",icon:"📕"};
      if(ext==="md")return{cls:"md",icon:"📝"};
      if(ext==="docx")return{cls:"docx",icon:"📄"};
      return{cls:"md",icon:"📄"};
    }

    function updateStats(){
      const items = fileList.querySelectorAll(".file-item");
      let d=0,p=0,f=0;
      items.forEach(i=>{
        const s=i.dataset.status;
        if(s==="completed")d++;else if(s==="processing"||s==="uploading")p++;else if(s==="failed")f++;
      });
      document.getElementById("statTotal").textContent=items.length;
      document.getElementById("statDone").textContent=d;
      document.getElementById("statProc").textContent=p;
      document.getElementById("statFail").textContent=f;
      emptyHint.style.display = items.length ? "none" : "block";
    }

    async function uploadFile(file){
      emptyHint.style.display = "none";
      const id = "file-"+Math.random().toString(36).slice(2,9);
      const fi = getFileIcon(file.name);
      const html = `
        <div class="file-item" id="${id}" data-status="uploading">
          <div class="file-row">
            <div class="file-icon ${fi.cls}">${fi.icon}</div>
            <div class="file-info">
              <div class="file-name">${escapeHtml(file.name)}</div>
              <div class="file-size">${formatSize(file.size)}</div>
            </div>
            <div class="status-badge sb-upload">上传中</div>
          </div>
          <div class="progress-bar"><div class="progress-fill pf-upload"></div></div>
          <div class="log-toggle" onclick="toggleLog('${id}')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg>日志</div>
          <ul class="log-list"></ul>
        </div>`;
      fileList.insertAdjacentHTML("afterbegin", html);
      const itemEl = document.getElementById(id);

      // check file type
      const ext = file.name.split(".").pop().toLowerCase();
      if(!["pdf","md","docx"].includes(ext)){
        setFailed(itemEl, "不支持的文件类型: ."+ext);
        updateStats();return;
      }

      const formData = new FormData();
      formData.append("file", file);

      try{
        const resp = await fetch(`${API_BASE}/upload`, {method:"POST",body:formData});
        if(!resp.ok){
          const errText = await resp.text();
          if(resp.status===409){setFailed(itemEl, "文件已导入，跳过重复导入")}
          else{setFailed(itemEl, "上传失败: "+errText)}
          updateStats();return;
        }
        const result = await resp.json();
        const taskId = result.task_id;

        setProcessing(itemEl, taskId);
        updateStats();
      }catch(err){
        setFailed(itemEl, "网络错误: "+(err.message||err));
        updateStats();
      }
    }

    function setFailed(itemEl, msg){
      itemEl.dataset.status = "failed";
      const badge = itemEl.querySelector(".status-badge");
      badge.textContent = "失败";badge.className = "status-badge sb-fail";
      const bar = itemEl.querySelector(".progress-fill");
      bar.className = "progress-fill pf-fail";
      addLog(itemEl, "❌ "+msg);
      updateStats();
    }

    function setProcessing(itemEl, taskId){
      itemEl.dataset.status = "processing";
      const badge = itemEl.querySelector(".status-badge");
      badge.textContent = "处理中";badge.className = "status-badge sb-proc";
      const bar = itemEl.querySelector(".progress-fill");
      bar.className = "progress-fill pf-proc";
      addLog(itemEl, "任务ID: "+taskId);

      pollStatus(taskId, itemEl);
    }

    function pollStatus(taskId, itemEl){
      const iv = setInterval(async()=>{
        try{
          const r = await fetch(`${API_BASE}/status/${taskId}`);
          const data = await r.json();
          renderLogs(itemEl, data.done_list, data.running_list);

          if(data.status==="completed"){
            clearInterval(iv);
            itemEl.dataset.status = "completed";
            const badge = itemEl.querySelector(".status-badge");
            badge.textContent = "已完成";badge.className = "status-badge sb-done";
            const bar = itemEl.querySelector(".progress-fill");
            bar.className = "progress-fill pf-done";
            updateStats();
          }else if(data.status==="failed"){
            clearInterval(iv);
            itemEl.dataset.status = "failed";
            const badge = itemEl.querySelector(".status-badge");
            badge.textContent = "失败";badge.className = "status-badge sb-fail";
            const bar = itemEl.querySelector(".progress-fill");
            bar.className = "progress-fill pf-fail";
            if(data.error)addLog(itemEl, "❌ "+data.error);
            updateStats();
          }
        }catch(e){}
      },2000);
    }

    function renderLogs(itemEl, doneList, runningList){
      const done = Array.isArray(doneList)?doneList:[];
      const run = Array.isArray(runningList)?runningList:[];
      const toggle = itemEl.querySelector(".log-toggle");
      toggle.lastChild.textContent = `日志（已完成${done.length}，进行中${run.length}）`;
      const ul = itemEl.querySelector(".log-list");
      ul.innerHTML = "";
      const lines = [...done.map(x=>`✅ ${x}`),...run.map(x=>`⏳ ${x}`)];
      if(!lines.length)ul.insertAdjacentHTML("beforeend","<li>暂无日志</li>");
      else for(const l of lines)ul.insertAdjacentHTML("beforeend",`<li>${escapeHtml(l)}</li>`);
    }

    function addLog(itemEl, msg){
      const ul = itemEl.querySelector(".log-list");
      ul.insertAdjacentHTML("beforeend",`<li>${escapeHtml(msg)}</li>`);
      ul.classList.add("show");
      itemEl.querySelector(".log-toggle").classList.add("open");
    }

    function toggleLog(id){
      const el = document.getElementById(id);
      const ul = el.querySelector(".log-list");
      const toggle = el.querySelector(".log-toggle");
      ul.classList.toggle("show");
      toggle.classList.toggle("open");
    }

    function escapeHtml(s){return String(s).replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;")}
    function formatSize(b){return b<1024?b+" B":b<1048576?(b/1024).toFixed(1)+" KB":(b/1048576).toFixed(2)+" MB"}
    // chat page served on port 8001
    document.getElementById("gotoChat").href = location.protocol + "//" + location.hostname + ":8001/chat.html";
  </script>
</body>
</html>
