# Reusable anchors ---------------------------------------------------------
x-api-volumes: &api-volumes
  - ./model_cache:/app/model_cache
  - ./temp_data:/app/temp_data
  - ./logs:/app/logs
  - ${MODEL_HOST_PATH:-./model_cache/models}:/models:ro

x-middleware-env: &middleware-env
  MILVUS_URL: http://milvus:19530
  MONGO_URL: mongodb://mongo:27017
  MINIO_ENDPOINT: minio:9000
  BGE_M3_PATH: /models/bge-m3
  BGE_RERANKER_LARGE: /models/bge-reranker-large
  MODELSCOPE_CACHE: /app/model_cache/modelscope
  HF_HOME: /app/model_cache/huggingface
  TEMP_DATA_DIR: /app/temp_data

services:
  # ---- middleware (no profile, always starts) ----
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://127.0.0.1:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    ports:
      - "2379:2379"

  milvus-minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    command: minio server /minio_data --console-address ":9001"
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ./volumes/milvus-minio:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.5
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - milvus-minio

  mongo:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - ./volumes/mongo:/data/db

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - ./volumes/minio:/data

  # ---- CPU profile (default) ----
  # Usage: docker compose --profile cpu -p zhihui-wenda-system up -d
  import-api-cpu:
    profiles: ["cpu"]
    build: .
    env_file: .env
    ports: ["8000:8000"]
    environment:
      <<: *middleware-env
      BGE_DEVICE: cpu
      BGE_RERANKER_DEVICE: cpu
      BGE_FP16: "False"
    volumes: *api-volumes
    depends_on: [milvus, mongo, minio]

  query-api-cpu:
    profiles: ["cpu"]
    build: .
    env_file: .env
    ports: ["8001:8001"]
    command: ["python", "-m", "uvicorn", "knowledge.api.query_router:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *middleware-env
      BGE_DEVICE: cpu
      BGE_RERANKER_DEVICE: cpu
      BGE_FP16: "False"
    volumes: *api-volumes
    depends_on: [milvus, mongo, minio]

  # ---- GPU profile ----
  # Usage: docker compose --profile gpu -p zhihui-wenda-system up -d
  # Requires nvidia-container-toolkit on host and CUDA-enabled torch in image.
  import-api-gpu:
    profiles: ["gpu"]
    build: .
    env_file: .env
    ports: ["8000:8000"]
    environment:
      <<: *middleware-env
      BGE_DEVICE: cuda
      BGE_RERANKER_DEVICE: cuda
      BGE_FP16: "False"
    volumes: *api-volumes
    depends_on: [milvus, mongo, minio]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  query-api-gpu:
    profiles: ["gpu"]
    build: .
    env_file: .env
    ports: ["8001:8001"]
    command: ["python", "-m", "uvicorn", "knowledge.api.query_router:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *middleware-env
      BGE_DEVICE: cuda
      BGE_RERANKER_DEVICE: cuda
      BGE_FP16: "False"
    volumes: *api-volumes
    depends_on: [milvus, mongo, minio]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]