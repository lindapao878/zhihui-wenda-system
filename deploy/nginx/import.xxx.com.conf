# 导入站点 — HTTP Basic Auth
server {
    listen 443 ssl http2;
    server_name import.xxx.com;

    ssl_certificate     /etc/letsencrypt/live/import.xxx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/import.xxx.com/privkey.pem;

    auth_basic "Admin Area";
    auth_basic_user_file /etc/nginx/.htpasswd;

    proxy_set_header X-API-Key "<APP_API_KEY>";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8000;
    }
}

server {
    listen 80;
    server_name import.xxx.com;
    return 301 https://$host$request_uri;
}
