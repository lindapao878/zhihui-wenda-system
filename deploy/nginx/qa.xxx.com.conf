# 问答站点 — 公网访问
server {
    listen 443 ssl http2;
    server_name qa.xxx.com;

    ssl_certificate     /etc/letsencrypt/live/qa.xxx.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/qa.xxx.com/privkey.pem;

    proxy_set_header X-API-Key "<APP_API_KEY>";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;

    # 静态页面
    location / {
        proxy_pass http://127.0.0.1:8001;
    }
    location /chat.html {
        proxy_pass http://127.0.0.1:8001;
    }

    # 健康探针 — 不限流
    location /health { proxy_pass http://127.0.0.1:8001; }
    location /ready  { proxy_pass http://127.0.0.1:8001; }

    # 查询接口 — 首版注释限流，观察一周日志后按需启用
    location /query {
        proxy_pass http://127.0.0.1:8001;
        # limit_req zone=query_limit burst=5 nodelay;
    }
    location /history {
        proxy_pass http://127.0.0.1:8001;
        # limit_req zone=query_limit burst=5 nodelay;
    }

    # SSE 流式 — 关闭代理缓冲和超时
    location /stream {
        proxy_pass http://127.0.0.1:8001;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}

server {
    listen 80;
    server_name qa.xxx.com;
    return 301 https://$host$request_uri;
}
